<!DOCTYPE html>

<html>
<body>

    <h1>My Diary</h1>

    <h2>Write a new entry</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Save entry</button>
    </form>

    <h2>My entries</h2>

    {% for entry in entries %}
        <h3><a href="{% url 'entry_page' entry.id %}">{{ entry.title }}</a></h3>
        <p>{{ entry.created_at }}</p>
    {% empty %}
        <p>No entries yet.</p>
    {% endfor %}

</body>
</html>
